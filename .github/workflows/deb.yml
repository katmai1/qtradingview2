name: Build .deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Qt oficial (igual que en local)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: "qtwebengine qtpositioning qtwebchannel"

      - name: Instalar herramientas de empaquetado
        run: |
          sudo apt-get update
          sudo gem install --no-document fpm
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage
          sudo mv linuxdeployqt-continuous-x86_64.AppImage /usr/local/bin/linuxdeployqt

      - name: Configurar y compilar (qmake)
        run: |
          mkdir build && cd build
          qmake ../QTradingview2.pro
          make -j$(nproc)

      - name: Preparar AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/qtradingview2 AppDir/usr/bin/
          cp resources/qtradingview2.desktop AppDir/usr/share/applications/
          cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/qtradingview2.png

      - name: Bundlear librerías Qt
        run: |
          export QMAKE=$(which qmake6 || which qmake)
          linuxdeployqt AppDir/usr/bin/qtradingview2 -qmake=$QMAKE -no-translations

      - name: Copiar recursos de QtWebEngine
        run: |
          QT_LIBEXEC=$QT_ROOT_DIR/libexec
          QT_RESOURCES=$QT_ROOT_DIR/resources
          QT_TRANSLATIONS=$QT_ROOT_DIR/translations

          mkdir -p AppDir/usr/libexec AppDir/usr/resources AppDir/usr/translations/qtwebengine_locales

          cp "$QT_LIBEXEC/QtWebEngineProcess" AppDir/usr/libexec/
          cp "$QT_RESOURCES"/*.pak AppDir/usr/resources/
          cp -r "$QT_TRANSLATIONS/qtwebengine_locales/"* AppDir/usr/translations/qtwebengine_locales/

      - name: Preparar wrapper de lanzamiento
        run: chmod +x resources/qtradingview2-wrapper.sh

      - name: Generar .deb
        run: |
          fpm -s dir -t deb -n qtradingview2 \
              -v "${GITHUB_REF_NAME#v}" \
              --prefix /opt/qtradingview2 \
              --deb-no-default-config-files \
              -C AppDir/usr bin lib share libexec resources translations \
              resources/qtradingview2-wrapper.sh=/usr/bin/qtradingview2

      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtradingview2-deb
          path: "*.deb"

      - name: Adjuntar a la Release (si es un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
