name: Build .deb

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Qt oficial (igual que en local)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: "qtwebengine qtpositioning qtwebchannel"

      - name: Instalar herramientas de empaquetado
        run: |
          sudo apt-get update
          sudo gem install --no-document fpm
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage
          chmod +x linuxdeployqt-continuous-x86_64.AppImage
          sudo mv linuxdeployqt-continuous-x86_64.AppImage /usr/local/bin/linuxdeployqt

      - name: Configurar y compilar (qmake)
        run: |
          mkdir build && cd build
          qmake ../qtradingview2.pro
          make -j$(nproc)

      - name: Listar binarios generados (debug)
        run: ls -la build/

      - name: Preparar AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/libexec AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps AppDir/usr/share/metainfo
          cp build/qtradingview2 AppDir/usr/libexec/qtradingview2
          cp resources/qtradingview2.desktop AppDir/usr/share/applications/
          cp resources/qtradingview2.metainfo.xml AppDir/usr/share/metainfo/
          cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/qtradingview2.png
          chmod +x resources/qtradingview2-wrapper.sh
          cp resources/qtradingview2-wrapper.sh AppDir/usr/bin/qtradingview2

      - name: Conservar solo el driver SQL usado (SQLite)
        run: |
          cd "$QT_ROOT_DIR/plugins/sqldrivers"
          find . -type f ! -name 'libqsqlite.so' -delete
          ls -la .

      - name: Eliminar plugins de geolocalización no usados
        run: rm -rf "$QT_ROOT_DIR/plugins/position"

      - name: Bundlear librerías Qt
        run: |
          export QMAKE=$(which qmake6 || which qmake)
          linuxdeployqt AppDir/usr/libexec/qtradingview2 -qmake=$QMAKE -no-translations

      - name: Copiar recursos de QtWebEngine
        run: |
          QT_LIBEXEC=$QT_ROOT_DIR/libexec
          QT_RESOURCES=$QT_ROOT_DIR/resources
          QT_TRANSLATIONS=$QT_ROOT_DIR/translations

          mkdir -p AppDir/usr/libexec AppDir/usr/resources AppDir/usr/translations/qtwebengine_locales

          cp "$QT_LIBEXEC/QtWebEngineProcess" AppDir/usr/libexec/
          cp -r "$QT_RESOURCES"/. AppDir/usr/resources/
          cp -r "$QT_TRANSLATIONS/qtwebengine_locales/"* AppDir/usr/translations/qtwebengine_locales/

      - name: Preparar script postinst
        run: chmod +x resources/postinst.sh

      - name: Generar .deb
        run: |
          fpm -s dir -t deb -n qtradingview2 \
              -v "${GITHUB_REF_NAME#v}" \
              --deb-no-default-config-files \
              --after-install resources/postinst.sh \
              -C AppDir/usr \
              bin/qtradingview2=/usr/bin/qtradingview2 \
              share/applications/qtradingview2.desktop=/usr/share/applications/qtradingview2.desktop \
              share/icons/hicolor/256x256/apps/qtradingview2.png=/usr/share/icons/hicolor/256x256/apps/qtradingview2.png \
              share/metainfo/qtradingview2.metainfo.xml=/usr/share/metainfo/qtradingview2.metainfo.xml \
              lib=/opt/qtradingview2 \
              libexec=/opt/qtradingview2 \
              resources=/opt/qtradingview2 \
              translations=/opt/qtradingview2 \
              plugins=/opt/qtradingview2

      - name: Subir como artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtradingview2-deb
          path: "*.deb"

      - name: Adjuntar a la Release (si es un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.deb"
